name: 🕒 Advanced WakaTime + Wake-Up Time Tracker

on:
  schedule:
    - cron: '0 */4 * * *'   # Every 4 hours (also covers midnight)
  workflow_dispatch:
# Note: no push trigger. This workflow commits wakatime_stats.json, which the
# Generate Profile Assets workflow picks up via its path filter — running it on
# every push would create a bot-commit loop.

jobs:
  wakatime-stats:
    runs-on: ubuntu-latest

    steps:
      - name: 🧭 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Authenticate with a PAT, not the default GITHUB_TOKEN: pushes made
          # with GITHUB_TOKEN never trigger other workflows, so the commit on
          # wakatime_stats.json would not reach the Generate Profile Assets
          # workflow and the SVG charts would stay stale.
          token: ${{ secrets.GH_TRAFFIC_TOKEN }}

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: � Install Dependencies
        run: pip install requests pytz

      - name: 📊 Fetch & Generate WakaTime Stats
        env:
          # WakaTime API keys are write-only since 2026-11-01 and only work in
          # plugins. This endpoint needs an OAuth token from https://wakatime.com/oauth.
          # Set WAKATIME_OAUTH_TOKEN; the legacy WAKATIME_API_KEY name is still read
          # as a fallback so the existing secret keeps working once its value is
          # replaced with the OAuth token.
          WAKATIME_OAUTH_TOKEN: ${{ secrets.WAKATIME_OAUTH_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python scripts/fetch_wakatime.py

      - name: 🧠 Update README with Dynamic Stats
        run: |
          python <<'PYEOF'
          import json
          import re
          from datetime import datetime, timezone

          # Read the stats
          with open("wakatime_stats.json", "r") as f:
              stats = json.load(f)

          # Read README
          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          # Update all dynamic fields
          updated = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
          today = stats.get("today_total", "0 hrs 0 mins")
          yesterday = stats.get("yesterday_total", "0 hrs 0 mins")
          this_week = stats.get("this_week_total", "0 hrs 0 mins")
          last_week = stats.get("last_week_total", "0 hrs 0 mins")
          change = stats.get("week_change", "N/A")
          productive_day = stats.get("most_productive_day", "N/A")
          productive_hours = stats.get("most_productive_hours", 0)
          top_lang = stats.get("top_language", "N/A")
          top_editor = stats.get("top_editor", "N/A")

          # Calculate additional metrics
          daily_hours = stats.get("daily_hours", [])
          active_days = sum(1 for h in daily_hours if h > 0)
          avg_daily = sum(daily_hours) / 7 if daily_hours else 0

          # Format for badges (replace spaces with underscores)
          today_badge = today.replace(" ", "_")
          yesterday_badge = yesterday.replace(" ", "_")
          this_week_badge = this_week.replace(" ", "_")
          last_week_badge = last_week.replace(" ", "_")
          change_badge = change.replace(" ", "_").replace("%", "%%25")

          # Format values for Quick Stats badges
          productive_badge = f"{productive_day}_({productive_hours:.1f}h)"
          top_lang_badge = top_lang.replace(" ", "_")
          top_editor_badge = top_editor.replace(" ", "_")
          avg_daily_badge = f"{avg_daily:.1f}_hrs"
          active_days_badge = f"{active_days}/7_days"

          # Helper function to safely replace between markers
          def safe_replace(content, start_marker, end_marker, new_value):
              try:
                  start = content.find(f"<!--{start_marker}-->")
                  end = content.find(f"<!--{end_marker}-->", start)
                  if start != -1 and end != -1:
                      old_content = content[start:end + len(f"<!--{end_marker}-->")]
                      new_content = f"<!--{start_marker}-->{new_value}<!--{end_marker}-->"
                      return content.replace(old_content, new_content, 1)
              except:
                  pass
              return content

          # Update timestamp
          readme = safe_replace(readme, "START_UPDATE_DATE", "END_UPDATE_DATE", updated)

          # Update Today stat badge in table
          readme = re.sub(
              r'!\[Today\]\(https://img\.shields\.io/badge/Today-[^)]+\)<!--START_TODAY_STAT--><!--END_TODAY_STAT-->',
              f'![Today](https://img.shields.io/badge/Today-{today_badge}-ff6b6b?style=for-the-badge&labelColor=1a1a2e)<!--START_TODAY_STAT--><!--END_TODAY_STAT-->',
              readme
          )

          # Update Yesterday stat badge
          readme = re.sub(
              r'!\[Yesterday\]\(https://img\.shields\.io/badge/Yesterday-[^)]+\)<!--START_YESTERDAY_STAT--><!--END_YESTERDAY_STAT-->',
              f'![Yesterday](https://img.shields.io/badge/Yesterday-{yesterday_badge}-feca57?style=for-the-badge&labelColor=1a1a2e)<!--START_YESTERDAY_STAT--><!--END_YESTERDAY_STAT-->',
              readme
          )

          # Update This Week stat badge
          readme = re.sub(
              r'!\[This Week\]\(https://img\.shields\.io/badge/This_Week-[^)]+\)<!--START_THISWEEK_STAT--><!--END_THISWEEK_STAT-->',
              f'![This Week](https://img.shields.io/badge/This_Week-{this_week_badge}-48dbfb?style=for-the-badge&labelColor=1a1a2e)<!--START_THISWEEK_STAT--><!--END_THISWEEK_STAT-->',
              readme
          )

          # Update Quick Stats badges - full img tag replacement
          readme = re.sub(
              r'<img src="https://img\.shields\.io/badge/🏆_Most_Productive-[^"]+style=for-the-badge&labelColor=1a1a2e" alt="Most Productive"/><!--START_PRODUCTIVE_DAY--><!--END_PRODUCTIVE_DAY-->',
              f'<img src="https://img.shields.io/badge/🏆_Most_Productive-{productive_badge}-4CAF50?style=for-the-badge&labelColor=1a1a2e" alt="Most Productive"/><!--START_PRODUCTIVE_DAY--><!--END_PRODUCTIVE_DAY-->',
              readme
          )

          readme = re.sub(
              r'<img src="https://img\.shields\.io/badge/💻_Top_Language-[^"]+style=for-the-badge&labelColor=1a1a2e" alt="Top Language"/><!--START_TOP_LANGUAGE--><!--END_TOP_LANGUAGE-->',
              f'<img src="https://img.shields.io/badge/💻_Top_Language-{top_lang_badge}-2196F3?style=for-the-badge&labelColor=1a1a2e" alt="Top Language"/><!--START_TOP_LANGUAGE--><!--END_TOP_LANGUAGE-->',
              readme
          )

          readme = re.sub(
              r'<img src="https://img\.shields\.io/badge/🛠️_Editor-[^"]+style=for-the-badge&labelColor=1a1a2e" alt="Editor"/><!--START_TOP_EDITOR--><!--END_TOP_EDITOR-->',
              f'<img src="https://img.shields.io/badge/🛠️_Editor-{top_editor_badge}-FF9800?style=for-the-badge&labelColor=1a1a2e" alt="Editor"/><!--START_TOP_EDITOR--><!--END_TOP_EDITOR-->',
              readme
          )

          readme = re.sub(
              r'<img src="https://img\.shields\.io/badge/⚡_Avg_Daily-[^"]+style=for-the-badge&labelColor=1a1a2e" alt="Avg Daily"/><!--START_AVG_DAILY--><!--END_AVG_DAILY-->',
              f'<img src="https://img.shields.io/badge/⚡_Avg_Daily-{avg_daily_badge}-9C27B0?style=for-the-badge&labelColor=1a1a2e" alt="Avg Daily"/><!--START_AVG_DAILY--><!--END_AVG_DAILY-->',
              readme
          )

          readme = re.sub(
              r'<img src="https://img\.shields\.io/badge/📅_Active_Days-[^"]+style=for-the-badge&labelColor=1a1a2e" alt="Active Days"/><!--START_ACTIVE_DAYS--><!--END_ACTIVE_DAYS-->',
              f'<img src="https://img.shields.io/badge/📅_Active_Days-{active_days_badge}-00BCD4?style=for-the-badge&labelColor=1a1a2e" alt="Active Days"/><!--START_ACTIVE_DAYS--><!--END_ACTIVE_DAYS-->',
              readme
          )

          # Update Change badge
          readme = re.sub(
              r'!\[Change\]\(https://img\.shields\.io/badge/📈_Change-[^)]+\)<!--START_WEEK_CHANGE_BADGE--><!--END_WEEK_CHANGE_BADGE-->',
              f'![Change](https://img.shields.io/badge/📈_Change-{change_badge}-gray?style=for-the-badge&labelColor=1a1a2e)<!--START_WEEK_CHANGE_BADGE--><!--END_WEEK_CHANGE_BADGE-->',
              readme
          )

          # Write back
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)

          print(f"✅ README updated successfully!")
          print(f"📅 Today: {today}")
          print(f"📆 Yesterday: {yesterday}")
          print(f"📊 This Week: {this_week}")
          print(f"🏆 Most Productive: {productive_day} ({productive_hours:.1f}h)")
          print(f"⚡ Avg Daily: {avg_daily:.1f} hrs")
          print(f"📅 Active Days: {active_days}/7")
          PYEOF

      - name: 📊 Update GitHub Stats (Commits, PRs, Issues)
        env:
          GH_TOKEN: ${{ secrets.GH_TRAFFIC_TOKEN }}
        run: |
          python <<'PYEOF'
          import os
          import re
          import requests

          gh_token = os.environ.get("GH_TOKEN", "")
          username = "ARPANPATRA111"

          headers = {
              "Accept": "application/vnd.github.v3+json",
              "User-Agent": username
          }
          if gh_token:
              headers["Authorization"] = f"token {gh_token}"

          # Fetch commits (from events API)
          total_commits = 0
          for page in range(1, 4):
              try:
                  resp = requests.get(
                      f"https://api.github.com/users/{username}/events?per_page=100&page={page}",
                      headers=headers,
                      timeout=30
                  )
                  if resp.status_code == 200:
                      events = resp.json()
                      push_events = [e for e in events if e.get("type") == "PushEvent"]
                      for e in push_events:
                          total_commits += len(e.get("payload", {}).get("commits", []))
              except:
                  pass

          # Fetch PRs
          total_prs = 0
          try:
              resp = requests.get(
                  f"https://api.github.com/search/issues?q=author:{username}+type:pr",
                  headers=headers,
                  timeout=30
              )
              if resp.status_code == 200:
                  total_prs = resp.json().get("total_count", 0)
          except:
              pass

          # Fetch Issues
          total_issues = 0
          try:
              resp = requests.get(
                  f"https://api.github.com/search/issues?q=author:{username}+type:issue",
                  headers=headers,
                  timeout=30
              )
              if resp.status_code == 200:
                  total_issues = resp.json().get("total_count", 0)
          except:
              pass

          print(f"📊 Commits: {total_commits}")
          print(f"📊 PRs: {total_prs}")
          print(f"📊 Issues: {total_issues}")

          # Update README
          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          # Update Commits badge
          readme = re.sub(
              r'!\[Commits\]\(https://img\.shields\.io/badge/🔥_Commits-[^)]+\)<!--START_COMMITS_STAT--><!--END_COMMITS_STAT-->',
              f'![Commits](https://img.shields.io/badge/🔥_Commits-{total_commits}-e74c3c?style=for-the-badge&labelColor=1a1a2e)<!--START_COMMITS_STAT--><!--END_COMMITS_STAT-->',
              readme
          )

          # Update PRs badge
          readme = re.sub(
              r'!\[PRs\]\(https://img\.shields\.io/badge/🔀_PRs-[^)]+\)<!--START_PRS_STAT--><!--END_PRS_STAT-->',
              f'![PRs](https://img.shields.io/badge/🔀_PRs-{total_prs}-9b59b6?style=for-the-badge&labelColor=1a1a2e)<!--START_PRS_STAT--><!--END_PRS_STAT-->',
              readme
          )

          # Update Issues badge
          readme = re.sub(
              r'!\[Issues\]\(https://img\.shields\.io/badge/✅_Issues-[^)]+\)<!--START_ISSUES_STAT--><!--END_ISSUES_STAT-->',
              f'![Issues](https://img.shields.io/badge/✅_Issues-{total_issues}-27ae60?style=for-the-badge&labelColor=1a1a2e)<!--START_ISSUES_STAT--><!--END_ISSUES_STAT-->',
              readme
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)

          print("✅ GitHub stats updated!")
          PYEOF
          
      - name: 💾 Commit wakatime_stats.json
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "github-action-bot@users.noreply.github.com"
          git add wakatime_stats.json README.md
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "🕒 Updated WakaTime JSON and README"
          
          # Retry loop for push with rebase to handle race conditions
          n=0
          until [ "$n" -ge 5 ]
          do
             git pull --rebase origin main && git push origin main && break
             n=$((n+1)) 
             echo "Push failed, retrying ($n/5)..."
             sleep 5
          done
